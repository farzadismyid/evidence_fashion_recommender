[project]
name = "evidence-fashion-recommender"
version = "0.1.0"
description = "Evidence-constrained multimodal fashion recommendation research pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "datasets>=4.0",
    "matplotlib>=3.11.1",
    "numpy>=2.0",
    "pandas>=2.2",
    "pillow>=11.0",
    "pyarrow>=19.0",
    "python-docx>=1.2.0",
    "pyyaml>=6.0",
    "scipy>=1.17.1",
    "sentence-transformers>=5.0",
    "torch>=2.7,<2.8",
    "transformers>=4.54",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.12",
]
cuda = [
    "torch>=2.7,<2.8",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", extra = "cuda" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evidence_fashion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"scripts/build_thesis_chapters.py" = ["E501"]
