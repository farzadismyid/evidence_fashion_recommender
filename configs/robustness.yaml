extends: paper_improved.yaml

run:
  experiment_name: robustness-v1

evaluation:
  recommendations_per_case: 1
  controlled_case_pool_per_target: 360

robustness:
  enabled: true
  development_fraction: 0.6
  validation_fraction: 0.2
  test_fraction: 0.2
  expanded_cases_per_category: 60
  hybrid_word_limits: [55, 75, 100]
  hybrid_rule_counts: [1, 2, 3, 5]
  hybrid_prompt_orders: [candidate_first, rules_first]
  rerank_clip_weights: [0.65, 0.75, 0.85, 0.9, 0.95, 1.0]
  generators:
    - provider: ollama
      name: llama3.2
      expected_digest: a80c4f17acd5
      think: false
      endpoint: http://localhost:11434
      temperature: 0.0
      max_tokens: 240
      timeout_seconds: 180
