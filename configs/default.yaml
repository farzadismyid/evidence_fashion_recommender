project:
  name: evidence-fashion-recommender
  seed: 42
  deterministic: true
  device: auto
  precision: float32

paths:
  data_dir: data
  raw_dir: data/raw
  processed_dir: data/processed
  knowledge_base: data/kb/fashion_rules_v3.csv
  outputs_dir: outputs
  cache_dir: outputs/cache

dataset:
  provider: huggingface
  name: Marqo/polyvore
  revision: null
  prefer_local_cache: true
  split: data
  image_column: image
  category_column: category
  text_column: text
  item_id_column: item_ID
  outfit_id_separator: "_"
  target_categories: [shoes, accessories, tops, bottoms, outerwear]
  query_categories: [dresses]

models:
  text_embedding:
    provider: sentence_transformers
    name: sentence-transformers/all-MiniLM-L6-v2
    revision: null
    local_files_only: false
    batch_size: 256
    normalize: true
  multimodal_embedding:
    provider: huggingface
    name: openai/clip-vit-base-patch32
    revision: null
    local_files_only: false
    batch_size: 64
    image_weight: 0.6
    text_weight: 0.4
    normalize: true
  captioning:
    enabled: true
    provider: huggingface
    name: microsoft/Florence-2-base-ft
    revision: null
    local_files_only: false
    batch_size: 8
    max_new_tokens: 64
  generator:
    provider: ollama
    name: llama3.2
    expected_digest: null
    think: false
    endpoint: http://localhost:11434
    temperature: 0.7
    max_tokens: 256
    timeout_seconds: 120
  judge:
    provider: ollama
    name: llama3.2
    expected_digest: null
    think: false
    endpoint: http://localhost:11434
    temperature: 0.0
    max_tokens: 180
    timeout_seconds: 120

preprocessing:
  broad_category_mapping: default
  remove_suspicious_text_mismatches: true
  remove_low_information_images: true
  low_information_std_threshold: 8.0

retrieval:
  backend: faiss
  metric: cosine
  query_mode: fused_multimodal
  candidate_pool_size: 50
  final_top_k: 5
  exclude_query_outfit: false

evidence:
  enabled: true
  kb_version: v3
  retrieval_model_role: text_embedding
  query_top_k: 5
  candidate_top_k: 5
  reliability_threshold: 0.0
  candidate_type_filtering: true

reranking:
  enabled: true
  method: weighted_sum
  clip_weight: 0.9
  evidence_weight: 0.1
  normalize_scores: true

generation:
  variants: [no_rag, item_rag, rule_rag, hybrid_rag]
  candidate_locked: true
  leakage_safe: true
  explanations_per_recommendation: 1
  prompt_version: v1

evaluation:
  controlled_cases: 300
  controlled_case_pool_per_target: 100
  negatives_per_case: 99
  cutoffs: [1, 3, 5, 10]
  explanation_cases_per_category: 10
  recommendations_per_case: 2
  bootstrap_samples: 5000
  confidence_level: 0.95
  multiple_comparison_methods: [holm, benjamini_hochberg]
  human_review_examples_per_variant_category: 6

robustness:
  enabled: false
  development_fraction: 0.6
  validation_fraction: 0.2
  test_fraction: 0.2
  expanded_cases_per_category: 60
  generators: []
  judges: []
  hybrid_word_limits: [55]
  hybrid_rule_counts: [5]
  hybrid_prompt_orders: [candidate_first]
  rerank_clip_weights: [0.9]

cache:
  policy: reuse
  hash_algorithm: sha256
  include_code_version: true

run:
  experiment_name: default
  save_intermediates: true
  log_level: INFO
