extends: robustness.yaml

run:
  experiment_name: final-eval-v2

final_evaluation:
  enabled: true
  output_root: outputs/final_eval_v2
  report_root: reports/final_eval_v2
  fusion_image_weights: [1.0, 0.9, 0.8, 0.7, 0.6, 0.5, 0.4, 0.3, 0.2, 0.1, 0.0]
  hybrid_word_budgets: [35, 55, 75]
  hybrid_rule_counts: [3, 5]
  hybrid_item_counts: [0, 2, 5]
  hybrid_evidence_orders: [rules_first, item_first]
  hybrid_practical_tie: 0.01
  hybrid_screening_cases_per_category: 10
  hybrid_finalist_count: 6
  proposed_reranking_selection_policy: evidence_in_loop_pareto_v2
  proposed_reranking_clip_weight: 0.75
  require_stage1_validation_packets: true
  claim_schema_version: v2
  judge_schema_version: v2
  primary_explanation_comparisons:
    - [rule_rag, no_rag]
    - [hybrid_rag, no_rag]
    - [rule_rag, item_rag]
    - [hybrid_rag, rule_rag]
  primary_retrieval_comparisons:
    - [clip_fused, minilm_text]
    - [clip_fused, clip_image]
    - [clip_fused, clip_text]
    - [evidence_reranked, clip_fused]
